[project]
name = "bracketbot-baymax"
version = "0.1.0"
description = "Safety-first interaction, gestures, and assistant tooling for BracketBot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
vision = [
    "emotiefflib==1.1.1",
    "ultralytics>=8.3",
]
rppg = [
    "mediapipe>=0.10",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.10",
]
dev = [
    "numpy>=1.24",
    "pytest>=8",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
